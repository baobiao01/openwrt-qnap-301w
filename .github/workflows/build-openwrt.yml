name: Build OpenWrt 301W NSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Init env
        uses: tteck/setup-openwrt-build-env@v1

      - name: Clone source (qosmio 6.6 NSS)
        run: |
          git clone https://github.com/qosmio/openwrt-ipq -b qualcommax-6.x-nss-wifi openwrt
          cd openwrt
          git clone https://github.com/qosmio/nss-packages.git package/nss-packages

      - name: Copy config & scripts
        run: |
          cp .config openwrt/
          cp diy-part1.sh openwrt/
          cp diy-part2.sh openwrt/

      - name: Feeds & config
        run: |
          cd openwrt
          bash diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 301W-openwrt-nss
          path: openwrt/bin/targets/qualcommax/ipq807x/*.bin
