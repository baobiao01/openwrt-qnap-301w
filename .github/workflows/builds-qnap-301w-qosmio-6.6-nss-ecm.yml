name: Build-QNAP-301W-6.6-NSS-ECM

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/qosmio/openwrt-ipq.git
  REPO_BRANCH: 24.10-nss
  DEVICE_TARGET: qualcommax
  DEVICE_SUBTARGET: ipq807x
  DEVICE_PROFILE: qnap_301w
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: qosmio/openwrt-ipq
        ref: 24.10-nss
        
    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
          python3 python3-pip python3-venv python3-distutils \
          rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        
    - name: Check kernel version
      run: |
        echo "Current kernel patchver:"
        cat target/linux/qualcommax/Makefile | grep KERNEL_PATCHVER || true
        echo ""
        echo "Available kernel configs:"
        ls -la target/linux/qualcommax/config-* 2>/dev/null || true
        
    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Generate config
      run: |
        cat > .config << 'EOF'
        # Target
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq807x=y
        CONFIG_TARGET_qualcommax_ipq807x_DEVICE_qnap_301w=y
        
        # 基础系统包
        CONFIG_PACKAGE_base-files=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_autocore=y
        CONFIG_PACKAGE_automount=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_default-settings-chn=y
        # 显式禁用 dnsmasq，只使用 dnsmasq-full
        CONFIG_PACKAGE_dnsmasq=n
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_firewall4=y
        CONFIG_PACKAGE_fstools=y
        CONFIG_PACKAGE_logd=y
        CONFIG_PACKAGE_libc=y
        CONFIG_PACKAGE_libgcc=y
        # 使用 mbedtls 版本避免冲突
        CONFIG_PACKAGE_libustream-mbedtls=y
        # CONFIG_PACKAGE_libustream-openssl is not set
        CONFIG_PACKAGE_losetup=y
        CONFIG_PACKAGE_mtd=y
        CONFIG_PACKAGE_netifd=y
        CONFIG_PACKAGE_nftables=y
        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        CONFIG_PACKAGE_opkg=y
        CONFIG_PACKAGE_ppp=y
        CONFIG_PACKAGE_ppp-mod-pppoe=y
        CONFIG_PACKAGE_procd-ujail=y
        CONFIG_PACKAGE_uboot-envtools=y
        CONFIG_PACKAGE_uci=y
        CONFIG_PACKAGE_uclient-fetch=y
        CONFIG_PACKAGE_urandom-seed=y
        CONFIG_PACKAGE_urngd=y
        
        # WiFi固件和驱动
        CONFIG_PACKAGE_ath11k-firmware-ipq8074=y
        CONFIG_PACKAGE_kmod-ath11k-ahb=y
        CONFIG_PACKAGE_ipq-wifi-qnap_301w=y
        CONFIG_PACKAGE_wpad-openssl=y
        
        # NSS核心驱动 - 6.6内核版本
        CONFIG_PACKAGE_kmod-qca-nss-dp=y
        CONFIG_PACKAGE_kmod-qca-nss-drv=y
        CONFIG_PACKAGE_kmod-qca-nss-ecm=y
        CONFIG_PACKAGE_kmod-qca-nss-gmac=y
        CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
        CONFIG_PACKAGE_kmod-qca-nss-drv-vlan-mgr=y
        
        # IPSec支持（6.6内核）
        CONFIG_PACKAGE_kmod-qca-nss-drv-ipsecmgr=y
        CONFIG_PACKAGE_kmod-qca-nss-drv-ipsecmgr-xfrm=y
        
        # SSDK
        CONFIG_PACKAGE_kmod-qca-ssdk=y
        
        # 基本系统
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        
        # NSS状态显示 - 在LuCI首页展示NSS/ECM占用（6.6内核新名称）
        CONFIG_PACKAGE_luci-app-nss=y
        CONFIG_PACKAGE_luci-i18n-nss-zh-cn=y
        CONFIG_PACKAGE_qca-nss-fw-ipq8074=y
        
        # LuCI应用
        CONFIG_PACKAGE_luci-app-cpufreq=y
        CONFIG_PACKAGE_luci-app-package-manager=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-lib-base=y
        CONFIG_PACKAGE_luci-lib-ipkg=y
        CONFIG_PACKAGE_luci-light=y
        
        # 网络工具
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_iperf3=y
        CONFIG_PACKAGE_tcpdump=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget-ssl=y
        
        # USB支持
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb-dwc3=y
        CONFIG_PACKAGE_kmod-usb-dwc3-qcom=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-uas=y
        
        # 文件系统
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-ntfs=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-fs-f2fs=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_f2fs-tools=y
        CONFIG_PACKAGE_ntfs-3g=y
        CONFIG_PACKAGE_blkid=y
        
        # 网络驱动
        CONFIG_PACKAGE_kmod-phy-aquantia=y
        CONFIG_PACKAGE_kmod-nf-nathelper=y
        CONFIG_PACKAGE_kmod-nf-nathelper-extra=y
        CONFIG_PACKAGE_kmod-nft-offload=y
        
        # 其他基础包
        CONFIG_PACKAGE_kmod-leds-gpio=y
        CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
        
        # 常用软件
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_luci-app-ddns=y
        CONFIG_PACKAGE_luci-app-sqm=y
        CONFIG_PACKAGE_luci-app-statistics=y
        CONFIG_PACKAGE_luci-app-vlmcsd=y
        
        # 系统监控
        CONFIG_PACKAGE_lm-sensors=y
        CONFIG_PACKAGE_lm-sensors-detect=y
        
        # 压缩工具
        CONFIG_PACKAGE_zlib=y
        CONFIG_PACKAGE_libopenssl=y
        
        # IPv6支持
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_kmod-ipt-nat6=y
        
        # 防火墙增强
        CONFIG_PACKAGE_iptables-mod-extra=y
        CONFIG_PACKAGE_kmod-ipt-extra=y
        EOF
        
    - name: Make defconfig
      run: |
        make defconfig
        # 清理可能存在的冲突配置
        sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
        make defconfig
      
    - name: Download packages
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Compile firmware
      env:
        TERM: xterm
      run: |
        make -j$(nproc) || make -j1 || make -j1 V=s
        
    - name: Check compiled files
      run: |
        echo "=== Checking compiled files ==="
        echo "Current directory: $(pwd)"
        echo ""
        echo "Contents of bin directory:"
        ls -la bin/ 2>/dev/null || echo "bin/ not found"
        echo ""
        echo "Contents of bin/targets:"
        ls -la bin/targets/ 2>/dev/null || echo "bin/targets/ not found"
        echo ""
        echo "Contents of bin/targets/qualcommax:"
        ls -la bin/targets/qualcommax/ 2>/dev/null || echo "bin/targets/qualcommax/ not found"
        echo ""
        echo "Contents of bin/targets/qualcommax/ipq807x:"
        ls -la bin/targets/qualcommax/ipq807x/ 2>/dev/null || echo "bin/targets/qualcommax/ipq807x/ not found"
        echo ""
        echo "All firmware files:"
        find bin/ -type f 2>/dev/null | head -30 || echo "No files found"
        
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: QNAP-301W-6.6-NSS-ECM
        path: |
          bin/targets/qualcommax/ipq807x/*
        if-no-files-found: warn
        
    - name: Upload specific firmware files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: QNAP-301W-firmware-files
        path: |
          bin/targets/qualcommax/ipq807x/*.bin
          bin/targets/qualcommax/ipq807x/*.img
          bin/targets/qualcommax/ipq807x/*.itb
          bin/targets/qualcommax/ipq807x/*.ubi
          bin/targets/qualcommax/ipq807x/*.tar.gz
          bin/targets/qualcommax/ipq807x/*.squashfs
        if-no-files-found: warn
