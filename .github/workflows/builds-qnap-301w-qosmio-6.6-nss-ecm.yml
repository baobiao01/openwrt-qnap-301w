name: Build ImmortalWrt 6.6 for QNAP 301W

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  COMMIT_HASH: ce68f61cb67a4701a108f838f510e72ca63ed78e
  DEVICE_TARGET: qualcommax
  DEVICE_SUBTARGET: ipq807x
  DEVICE_PROFILE: qnap_301w
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
          python3 python3-pip python3-venv python3-distutils \
          rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        
    - name: Clone Source Code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git checkout $COMMIT_HASH
        echo "OPENWRT_ROOT=$(pwd)" >> $GITHUB_ENV
        
    - name: Update Feeds
      run: |
        cd $OPENWRT_ROOT
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Generate Config
      run: |
        cd $OPENWRT_ROOT
        cat > .config <<EOF
        CONFIG_TARGET_${DEVICE_TARGET}=y
        CONFIG_TARGET_${DEVICE_TARGET}_${DEVICE_SUBTARGET}=y
        CONFIG_TARGET_${DEVICE_TARGET}_${DEVICE_SUBTARGET}_DEVICE_${DEVICE_PROFILE}=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        EOF
        make defconfig
        
    - name: Download Packages
      run: |
        cd $OPENWRT_ROOT
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Compile Firmware
      env:
        TERM: xterm
      run: |
        cd $OPENWRT_ROOT
        make -j$(nproc) || make -j1 || make -j1 V=s
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-qnap-301w-6.6
        path: |
          openwrt/bin/targets/${{ env.DEVICE_TARGET }}/${{ env.DEVICE_SUBTARGET }}/*
          
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: qnap-301w-6.6-${{ github.run_number }}
        name: ImmortalWrt 6.6 for QNAP 301W #${{ github.run_number }}
        body: |
          自动编译的 ImmortalWrt 6.6 固件
          目标设备：QNAP QHora-301W
          内核版本：6.6
          源码提交：${{ env.COMMIT_HASH }}
        files: |
          openwrt/bin/targets/${{ env.DEVICE_TARGET }}/${{ env.DEVICE_SUBTARGET }}/*
